name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version is already published
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.pkg.outputs.version }}"
          if pnpm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm build

      - name: Validate published types (are-the-types-wrong)
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm attw

      # Trusted publishing (OIDC): no long-lived NPM_TOKEN. The npm CLI detects the
      # id-token: write OIDC environment and exchanges it for a short-lived publish
      # token. pnpm's native publish does not do this exchange, so the publish step
      # runs through the npm CLI. Requires npm >= 11.5.1 (newer than the npm bundled
      # with Node 22), hence the upgrade. access + provenance come from publishConfig;
      # provenance is generated automatically for a public package from a public repo.
      - name: Upgrade npm for trusted publishing (OIDC)
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --tag ${{ steps.pkg.outputs.tag }}

      - name: Create mirror GitHub Release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          NOTES_FILE="RELEASE_NOTES.md"

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "::error::Missing ${NOTES_FILE}. Sync must copy curated notes from the monorepo (packages/payment-elements-v1/releases/${VERSION}.md). See GIV-9458."
            exit 1
          fi
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::${NOTES_FILE} exists but is empty."
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [[ "${{ steps.pkg.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # shellcheck disable=SC2086  # intentional word-splitting on PRERELEASE_FLAG
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$NOTES_FILE" \
            ${PRERELEASE_FLAG}
