name: Release

# PR 14.5.f (GIV-9138): the public side of the release-triggered, baked-version
# flow. The npm version is baked once by a human in the private monorepo PR and
# synced into this repo by the type-sync bot PR. Merging that PR to `main` runs
# this workflow, which publishes the matching npm version (with provenance) and
# cuts a 1:1 mirror GitHub Release.
#
# Lockstep: the published npm version always equals the monorepo `sdkVersion`.
# Prereleases (a hyphen in the semver, e.g. 1.2.0-alpha.1) publish under the
# `next` dist-tag so a bare `npm install` never resolves to a prerelease.

on:
    push:
        branches: [main]
        paths:
            - package.json

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # create the mirror GitHub Release
            id-token: write # npm provenance via OIDC
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            - name: Read package version
              id: pkg
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  if [[ "${VERSION}" == *-* ]]; then
                    echo "tag=next" >> "$GITHUB_OUTPUT"
                    echo "prerelease=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=latest" >> "$GITHUB_OUTPUT"
                    echo "prerelease=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check if version is already published
              id: check
              run: |
                  NAME="$(node -p "require('./package.json').name")"
                  VERSION="${{ steps.pkg.outputs.version }}"
                  if pnpm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
                    echo "Version ${VERSION} already published; skipping."
                    echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Typecheck
              if: steps.check.outputs.should_publish == 'true'
              run: pnpm typecheck

            - name: Test
              if: steps.check.outputs.should_publish == 'true'
              run: pnpm test

            - name: Build
              if: steps.check.outputs.should_publish == 'true'
              run: pnpm build

            - name: Validate published types (are-the-types-wrong)
              if: steps.check.outputs.should_publish == 'true'
              run: pnpm attw

            - name: Publish to npm
              if: steps.check.outputs.should_publish == 'true'
              run: pnpm publish --no-git-checks --access public --provenance --tag ${{ steps.pkg.outputs.tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create mirror GitHub Release
              if: steps.check.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${{ steps.pkg.outputs.version }}"
                  PRERELEASE_FLAG=""
                  if [[ "${{ steps.pkg.outputs.prerelease }}" == "true" ]]; then
                    PRERELEASE_FLAG="--prerelease"
                  fi
                  gh release create "v${VERSION}" \
                    --title "v${VERSION}" \
                    --generate-notes \
                    ${PRERELEASE_FLAG}
