name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Read package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version is already published
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="${{ steps.pkg.outputs.version }}"
          if pnpm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm build

      - name: Validate published types (are-the-types-wrong)
        if: steps.check.outputs.should_publish == 'true'
        run: pnpm attw

      # Trusted publishing (OIDC): no long-lived NPM_TOKEN. The npm CLI detects the
      # id-token: write OIDC environment and exchanges it for a short-lived publish
      # token. pnpm's native publish does not do this exchange, so the publish step
      # runs through the npm CLI. Requires npm >= 11.5.1 (newer than the npm bundled
      # with Node 22), hence the upgrade. access + provenance come from publishConfig;
      # provenance is generated automatically for a public package from a public repo.
      - name: Upgrade npm for trusted publishing (OIDC)
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --tag ${{ steps.pkg.outputs.tag }}

      - name: Create mirror GitHub Release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          PRERELEASE_FLAG=""
          if [[ "${{ steps.pkg.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            ${PRERELEASE_FLAG}
